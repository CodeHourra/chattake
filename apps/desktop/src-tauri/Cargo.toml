[package]
name = "chattake-desktop"
version = "0.2.3"
description = "有得 · AI 对话知识库"
authors = ["ChatTake"]
edition = "2021"

[lib]
name = "chattake_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "serde_json"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
dirs = "5"
walkdir = "2"
md5 = "0.7"
log = "0.4"
env_logger = "0.11"
thiserror = "1"
serde_yaml = "0.9"
tauri-plugin-dialog = "2"
# 应用内检查更新、下载安装包（与 tauri.conf plugins.updater 配套）
tauri-plugin-updater = "2"
# 安装更新后重启进程（前端 relaunch）
tauri-plugin-process = "2"
# workspace.json 中 folder 对非 ASCII 路径常使用百分号编码，需按 URL 解析后还原本地路径
url = "2"

[dev-dependencies]
tempfile = "3"
